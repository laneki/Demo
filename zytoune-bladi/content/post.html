<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Post - Zytoune Bladi</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <script defer src="/assets/js/i18n.js"></script>
  <script defer src="/assets/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-include="/partials/header.html"></div>
<main id="main" class="post-page">
  <article>
    <h1 id="post-title">Blog Title</h1>
    <img id="post-cover" src="https://placehold.co/800x400?text=Post" alt="Blog cover">

  <section class="related-posts" aria-labelledby="related-posts-title">

</main>
<div data-include="/partials/footer.html"></div>
<div data-include="/partials/mobile-nav.html"></div>
<div data-include="/partials/cart-drawer.html"></div>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "Blog Title",
  "image": "https://placehold.co/800x400?text=Post",
  "author": {"@type": "Person", "name": "Admin"}
}
</script>
</body>
</html>
