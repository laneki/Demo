<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Zytoune Bladi</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <script defer src="/assets/js/i18n.js"></script>
  <script defer src="/assets/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-include="/partials/header.html"></div>
<main id="main" class="contact-page">
  <h1>Contact</h1>
  <div class="contact-grid">
    <div>
      <form id="contact-form">
        <label>Name <input type="text" required></label>
        <label>Email <input type="email" required></label>
        <label>Message <textarea required></textarea></label>
        <button class="btn btn--primary" type="submit">Send</button>
      </form>
    </div>
    <div>
      <img src="https://placehold.co/600x400?text=Map" alt="Map placeholder">
    </div>
  </div>
</main>
<div data-include="/partials/footer.html"></div>
<div data-include="/partials/mobile-nav.html"></div>
<div data-include="/partials/cart-drawer.html"></div>
